<!DOCTYPE html>
<html>
    <head>
        <title>My Website</title>
    </head>
    <body>
        <h1>Welcome to My Website</h1>
        <hr>
        <a href="https://www.google.com/">
            <img src="/images/cat.webp" alt="Cat Picture" height="200">
        </a>
        <audio controls>
            <!--If a web browser doesn't support a type of audio file, we can add multiple same audio files just in case-->
            <source src="example.mp3" type="audio/mpeg" >
            <source src="example.wav" type="audio/wav" >
        </audio>
        <audio controls autoplay muted loop>
            <source src="example2.mp3" type="audio/mpeg">
            <source src="example2.wav" type="audio/wav">
        </audio>
    </body>
</html>
