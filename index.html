<!DOCTYPE html>
<html>
    <head>
        <title>My Website</title>
    </head>
    <body>
        <h1>Welcome to My Website</h1>
        <hr>
        <a href="https://www.google.com/" target="_blank" title="Google Site">
            Google
        </a>
        <br>
        <h3>Cat here</h3>
        <!--We can put img elements inside the 'a' element to make the image able to redirect to a link when clicked-->
        <a href="https://www.google.com/">
            <!--We use alt when image isn't visible and for those who use read aloud / are blind-->
            <img src="/images/cat.webp" alt="Cat Picture" height="200">
        </a>
    </body>
</html>
